<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monte seu Site | PageMaster</title>
  <meta name="description" content="Configure o site que voce precisa e receba uma estimativa de valor instantanea. Simples, rapido e transparente." />
  <link rel="icon" href="../favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
:root{--primary:#2962FF;--primary-dark:#1E40AF;--primary-light:#EFF6FF;--secondary:#0F172A;--muted:#64748B;--surface:#FFFFFF;--background:#F8FAFC;--border:#E2E8F0;--success:#10B981;--radius-sm:.75rem;--radius-md:1.25rem;--radius-lg:1.75rem;--radius-xl:2.5rem;--shadow-soft:0 4px 24px -4px rgba(0,0,0,.08);--shadow-card:0 8px 32px -8px rgba(0,0,0,.1);--transition:all .3s cubic-bezier(.4,0,.2,1)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;background:var(--background);color:var(--secondary);-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%}button{cursor:pointer;border:none;background:none;font-family:inherit}
input,textarea,select{font-family:inherit}a{text-decoration:none;color:inherit}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--background)}::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:3px}
@keyframes fadeInUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUpSheet{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes pulse-soft{0%,100%{box-shadow:0 0 0 0 rgba(41,98,255,.3)}50%{box-shadow:0 0 0 12px rgba(41,98,255,0)}}
#app{display:grid;grid-template-columns:1fr;min-height:100dvh}
@media(min-width:1024px){#app{grid-template-columns:1fr 360px;align-items:start}}
.site-header{position:fixed;top:1.25rem;left:50%;transform:translateX(-50%);z-index:100;width:calc(100% - 2rem);max-width:900px;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:9999px;padding:.75rem 1.5rem;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow-soft)}
.header-logo{display:flex;align-items:center;gap:.5rem;font-weight:800;font-size:1.125rem;letter-spacing:-.04em}
.header-logo span{color:var(--primary)}
.header-tag{background:var(--primary-light);color:var(--primary);font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:.25rem .75rem;border-radius:9999px}
.main-content{padding:7rem 1.25rem 4rem;max-width:780px;margin:0 auto;width:100%}
@media(min-width:1024px){.main-content{padding:7rem 2.5rem 4rem 2.5rem;max-width:none}}
.progress-wrapper{margin-bottom:3rem}
.progress-steps{display:flex;align-items:center;gap:0;margin-bottom:1rem}
.progress-step{display:flex;align-items:center;flex:1}
.step-circle{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;flex-shrink:0;transition:var(--transition);border:2px solid var(--border);background:var(--surface);color:var(--muted)}
.step-circle.active{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 0 0 4px rgba(41,98,255,.15)}
.step-circle.done{background:var(--success);border-color:var(--success);color:#fff}
.step-line{flex:1;height:2px;background:var(--border);transition:background .4s}
.step-line.done{background:var(--success)}
.progress-labels{display:flex;justify-content:space-between}
.progress-label{font-size:.65rem;font-weight:600;color:var(--muted);text-align:center;width:32px;line-height:1.2}
.progress-label.active{color:var(--primary)}
.progress-bar-track{height:3px;background:var(--border);border-radius:9999px;margin-top:1rem;overflow:hidden}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary-dark));border-radius:9999px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.step-header{margin-bottom:2rem}
.step-eyebrow{font-size:.7rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--primary);margin-bottom:.5rem}
.step-title{font-family:'Outfit',sans-serif;font-size:clamp(1.6rem,4vw,2.25rem);font-weight:800;color:var(--secondary);line-height:1.15;letter-spacing:-.03em;margin-bottom:.625rem}
.step-subtitle{font-size:.9375rem;color:var(--muted);line-height:1.6;max-width:560px}
.cards-grid{display:grid;grid-template-columns:1fr;gap:1rem}
@media(min-width:540px){.cards-grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:768px){.cards-grid-3{grid-template-columns:repeat(3,1fr)}}
.option-card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius-lg);padding:1.5rem;cursor:pointer;transition:var(--transition);position:relative;display:flex;flex-direction:column;gap:.75rem;user-select:none}
.option-card:hover{border-color:rgba(41,98,255,.4);box-shadow:var(--shadow-card);transform:translateY(-2px)}
.option-card.selected{border-color:var(--primary);background:#FAFBFF;box-shadow:0 0 0 4px rgba(41,98,255,.08),var(--shadow-card)}
.card-check{position:absolute;top:1rem;right:1rem;width:22px;height:22px;border-radius:50%;border:2px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;transition:var(--transition);flex-shrink:0}
.option-card.selected .card-check{background:var(--primary);border-color:var(--primary)}
.card-check svg{display:none}
.option-card.selected .card-check svg{display:block}
.card-icon{width:44px;height:44px;background:var(--primary-light);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:1.25rem}
.card-name{font-weight:700;font-size:1rem;color:var(--secondary);line-height:1.2}
.card-desc{font-size:.8125rem;color:var(--muted);line-height:1.55}
.card-price{font-size:.8rem;font-weight:700;color:var(--primary);margin-top:auto}
.card-badge{display:inline-flex;align-items:center;padding:.2rem .6rem;border-radius:9999px;font-size:.65rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.badge-popular{background:#FEF3C7;color:#92400E}
.badge-rec{background:#D1FAE5;color:#065F46}
.badge-ads{background:#EDE9FE;color:#5B21B6}
.badge-local{background:#DBEAFE;color:#1E40AF}
.feature-grid{display:grid;grid-template-columns:1fr;gap:.75rem}
@media(min-width:540px){.feature-grid{grid-template-columns:repeat(2,1fr)}}
.feature-card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius-md);padding:1.125rem 1.25rem;cursor:pointer;transition:var(--transition);display:flex;align-items:flex-start;gap:.875rem;user-select:none}
.feature-card:hover{border-color:rgba(41,98,255,.35);box-shadow:var(--shadow-soft);transform:translateY(-1px)}
.feature-card.selected{border-color:var(--primary);background:#FAFBFF;box-shadow:0 0 0 4px rgba(41,98,255,.07)}
.feature-checkbox{width:20px;height:20px;border-radius:6px;border:2px solid var(--border);background:var(--surface);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:var(--transition);margin-top:.1rem}
.feature-card.selected .feature-checkbox{background:var(--primary);border-color:var(--primary)}
.feature-checkbox svg{display:none}
.feature-card.selected .feature-checkbox svg{display:block}
.feature-info{flex:1;min-width:0}
.feature-name{font-weight:700;font-size:.875rem;color:var(--secondary);margin-bottom:.25rem;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.feature-desc{font-size:.775rem;color:var(--muted);line-height:1.5}
.feature-price{font-size:.75rem;font-weight:700;color:var(--primary);margin-top:.4rem}
.feature-price.free{color:var(--success)}
.size-options{display:flex;flex-direction:column;gap:.625rem;margin-bottom:2rem}
.size-option{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius-md);padding:1rem 1.25rem;cursor:pointer;transition:var(--transition);display:flex;align-items:center;justify-content:space-between;gap:1rem;user-select:none}
.size-option:hover{border-color:rgba(41,98,255,.4);transform:translateX(4px)}
.size-option.selected{border-color:var(--primary);background:#FAFBFF;box-shadow:0 0 0 4px rgba(41,98,255,.08)}
.size-name{font-weight:700;font-size:.9375rem;color:var(--secondary)}
.size-desc{font-size:.8rem;color:var(--muted)}
.size-extra{font-size:.8rem;font-weight:700;color:var(--primary);white-space:nowrap}
.example-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:1.25rem 1.5rem;margin-bottom:2rem}
.example-box-title{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:.875rem}
.example-list{list-style:none;display:flex;flex-direction:column;gap:.375rem}
.example-list li{display:flex;align-items:center;gap:.625rem;font-size:.8125rem;color:var(--secondary)}
.example-list li::before{content:'';width:6px;height:6px;background:var(--primary);border-radius:50%;flex-shrink:0}
.custom-info{background:linear-gradient(135deg,var(--primary-light),#EEF2FF);border:1px solid rgba(41,98,255,.2);border-radius:var(--radius-md);padding:1.5rem;display:flex;align-items:flex-start;gap:1rem;margin-top:1rem}
.custom-info-icon{width:40px;height:40px;background:var(--primary);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.form-group{margin-bottom:1.25rem}
.form-label{display:block;font-size:.8125rem;font-weight:600;color:var(--secondary);margin-bottom:.4rem}
.form-label span{color:var(--muted);font-weight:400}
.form-input{width:100%;background:var(--surface);border:2px solid var(--border);border-radius:var(--radius-sm);padding:.875rem 1rem;font-size:.9375rem;color:var(--secondary);transition:var(--transition);outline:none}
.form-input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(41,98,255,.1)}
.form-input::placeholder{color:#94A3B8}
textarea.form-input{resize:vertical;min-height:100px}
.form-row{display:grid;grid-template-columns:1fr;gap:1rem}
@media(min-width:540px){.form-row{grid-template-columns:repeat(2,1fr)}}
.radio-group{display:flex;gap:.75rem;flex-wrap:wrap}
.radio-opt{display:flex;align-items:center;gap:.5rem;padding:.625rem 1rem;border:2px solid var(--border);border-radius:9999px;cursor:pointer;transition:var(--transition);font-size:.875rem;font-weight:600;color:var(--muted);user-select:none}
.radio-opt:hover{border-color:var(--primary);color:var(--primary)}
.radio-opt.selected{border-color:var(--primary);background:var(--primary-light);color:var(--primary)}
.nav-buttons{display:flex;align-items:center;justify-content:space-between;margin-top:2.5rem;gap:1rem;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.875rem 1.75rem;border-radius:9999px;font-size:.875rem;font-weight:700;letter-spacing:.01em;transition:var(--transition)}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 4px 20px -4px rgba(41,98,255,.5)}
.btn-primary:hover{background:var(--primary-dark);transform:translateY(-2px);box-shadow:0 8px 28px -4px rgba(41,98,255,.5)}
.btn-secondary{background:var(--surface);color:var(--secondary);border:2px solid var(--border)}
.btn-secondary:hover{border-color:var(--primary);color:var(--primary)}
.btn-ghost{color:var(--muted);font-size:.8125rem;padding:.5rem}
.btn-ghost:hover{color:var(--primary)}
.btn-whatsapp{background:#25D366;color:#fff;box-shadow:0 4px 20px -4px rgba(37,211,102,.5);font-size:1rem;padding:1.125rem 2rem;width:100%;justify-content:center}
.btn-whatsapp:hover{background:#128C7E;transform:translateY(-2px);box-shadow:0 8px 28px -4px rgba(37,211,102,.5)}
.sidebar{display:none;position:sticky;top:5.5rem;padding:1.5rem 1.5rem 1.5rem 0;max-height:calc(100dvh - 6rem);overflow-y:auto}
@media(min-width:1024px){.sidebar{display:block}}
.sidebar::-webkit-scrollbar{width:4px}
.sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.summary-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xl);overflow:hidden;box-shadow:var(--shadow-card)}
.summary-header{background:var(--secondary);padding:1.25rem 1.5rem;display:flex;align-items:center;gap:.75rem}
.summary-header-icon{width:36px;height:36px;background:rgba(255,255,255,.1);border-radius:.625rem;display:flex;align-items:center;justify-content:center}
.summary-header h3{color:#fff;font-weight:700;font-size:.9375rem}
.summary-header p{color:rgba(255,255,255,.55);font-size:.7rem}
.summary-body{padding:1.25rem 1.5rem}
.summary-item{display:flex;flex-direction:column;gap:.25rem;padding:.75rem 0;border-bottom:1px solid var(--border)}
.summary-item:last-child{border-bottom:none}
.summary-item-label{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.summary-item-value{font-size:.875rem;font-weight:600;color:var(--secondary)}
.summary-item-value.empty{color:#CBD5E1;font-weight:400;font-style:italic}
.summary-tags{display:flex;flex-wrap:wrap;gap:.375rem;margin-top:.25rem}
.summary-tag{background:var(--primary-light);color:var(--primary);font-size:.7rem;font-weight:600;padding:.2rem .6rem;border-radius:9999px}
.summary-footer{background:var(--background);padding:1.25rem 1.5rem;border-top:1px solid var(--border)}
.summary-price-label{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:.375rem}
.summary-price{font-family:'Outfit',sans-serif;font-size:2rem;font-weight:900;color:var(--secondary);letter-spacing:-.04em;line-height:1}
.summary-price .currency{font-size:1rem;vertical-align:top;margin-top:.3rem;display:inline-block}
.summary-price-custom{font-size:1.125rem;font-weight:700;color:var(--muted)}
.summary-disclaimer{font-size:.7rem;color:#94A3B8;line-height:1.5;margin-top:.625rem}
.mobile-summary-btn{position:fixed;bottom:1.5rem;right:1.25rem;z-index:90;background:var(--secondary);color:#fff;border-radius:9999px;padding:.75rem 1.25rem;display:flex;align-items:center;gap:.5rem;font-size:.8125rem;font-weight:700;box-shadow:0 8px 32px -4px rgba(15,23,42,.35);transition:var(--transition)}
.mobile-summary-btn:hover{transform:scale(1.05)}
@media(min-width:1024px){.mobile-summary-btn{display:none}}
.mobile-summary-sheet{position:fixed;inset:0;z-index:200;display:none}
.mobile-summary-sheet.open{display:flex;flex-direction:column}
.sheet-backdrop{position:absolute;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(4px);animation:fadeIn .25s ease}
.sheet-content{position:absolute;bottom:0;left:0;right:0;background:var(--surface);border-radius:var(--radius-xl) var(--radius-xl) 0 0;max-height:85dvh;overflow-y:auto;animation:slideUpSheet .35s cubic-bezier(.16,1,.3,1) both}
.sheet-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:.875rem auto 0}
.sheet-close{position:absolute;top:1rem;right:1rem;width:32px;height:32px;border-radius:50%;background:var(--background);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:1.125rem;line-height:1;cursor:pointer;border:none}
.sheet-inner{padding:0 1.25rem 2rem}
.final-hero{background:linear-gradient(135deg,var(--secondary) 0%,#1E293B 100%);border-radius:var(--radius-xl);padding:2.5rem;margin-bottom:2rem;position:relative;overflow:hidden;text-align:center}
.final-hero::before{content:'';position:absolute;top:-40%;left:-20%;width:140%;height:140%;background:radial-gradient(ellipse at 60% 40%,rgba(41,98,255,.25) 0%,transparent 65%);pointer-events:none}
.final-hero-emoji{font-size:3rem;margin-bottom:1rem;display:block}
.final-hero h2{font-family:'Outfit',sans-serif;font-size:clamp(1.4rem,4vw,2rem);font-weight:800;color:#fff;letter-spacing:-.03em;margin-bottom:.5rem}
.final-hero p{font-size:.9rem;color:rgba(255,255,255,.6);max-width:420px;margin:0 auto}
.divider{height:1px;background:var(--border);margin:2rem 0}
.info-note{display:flex;align-items:flex-start;gap:.625rem;background:#FFF7ED;border:1px solid #FED7AA;border-radius:var(--radius-sm);padding:.875rem 1rem;font-size:.8rem;color:#92400E;line-height:1.5;margin-top:1rem}
.step-panel{display:none}
.step-panel.active{display:block;animation:fadeInUp .4s cubic-bezier(.16,1,.3,1) both}
.success-screen{display:none;flex-direction:column;align-items:center;text-align:center;padding:4rem 2rem}
.success-screen.active{display:flex;animation:fadeInUp .5s cubic-bezier(.16,1,.3,1) both}
.success-icon{width:80px;height:80px;background:#D1FAE5;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2.25rem;margin-bottom:1.5rem;animation:pulse-soft 2s infinite}
.bg-grid{background-image:linear-gradient(to right,rgba(41,98,255,.04) 1px,transparent 1px),linear-gradient(to bottom,rgba(41,98,255,.04) 1px,transparent 1px);background-size:48px 48px}
.product-counter{display:flex;align-items:center;gap:0.5rem;margin-top:0.75rem;background:#F1F5F9;padding:0.4rem 0.75rem;border-radius:9999px;width:fit-content}
.counter-btn{width:26px;height:26px;border-radius:50%;background:#fff;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.95rem;color:var(--secondary);cursor:pointer;transition:var(--transition);user-select:none}
.counter-btn:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
.counter-input{width:60px;text-align:center;border:1px solid var(--border);background:#fff;border-radius:6px;padding:0.25rem;font-weight:700;font-size:0.875rem;color:var(--secondary);outline:none}
.counter-input:focus{border-color:var(--primary)}
.svg-icon{width:22px;height:22px;stroke:var(--primary);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;fill:none;display:inline-block}
  </style>
</head>
<body class="bg-grid">
<header class="site-header">
  <div style="font-family:'Outfit',sans-serif;font-weight:800;font-size:1.1rem;color:var(--secondary);letter-spacing:-0.03em">
    Monte seu <span style="color:var(--primary)">Site</span>
  </div>
  <button class="btn btn-ghost" onclick="confirmReset()" style="padding:.4rem .85rem;border:1px solid var(--border);border-radius:9999px;font-size:.75rem;color:var(--muted);cursor:pointer">&#8634; Recomeçar</button>
</header>
<div id="app">
  <main class="main-content">
    <div class="progress-wrapper" id="progressWrapper">
      <div class="progress-steps" id="progressSteps"></div>
      <div class="progress-labels" id="progressLabels"></div>
      <div class="progress-bar-track"><div class="progress-bar-fill" id="progressFill" style="width:0%"></div></div>
    </div>
    <div id="stepsContainer"></div>
    <div class="success-screen" id="successScreen">
      <div class="success-icon">&#10003;</div>
      <h2 style="font-family:'Outfit',sans-serif;font-size:1.75rem;font-weight:800;color:var(--secondary);letter-spacing:-.03em;margin-bottom:.5rem">Mensagem enviada!</h2>
      <p style="color:var(--muted);font-size:.9375rem;line-height:1.6;max-width:380px;margin-bottom:2rem">Sua configuracao foi enviada pelo WhatsApp. Em breve entraremos em contato para confirmar seu orcamento.</p>
      <button class="btn btn-primary" onclick="fullReset()">&#8592; Fazer uma nova estimativa</button>
    </div>
    <div class="nav-buttons" id="navButtons"></div>
  </main>
  <aside class="sidebar"><div class="summary-card" id="summaryCard"></div></aside>
</div>
<button class="mobile-summary-btn" id="mobileSummaryBtn" onclick="openMobileSheet()">
  <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg>
  Ver resumo
  <span id="mobileBadgePrice" style="background:var(--primary);color:#fff;border-radius:9999px;padding:.15rem .6rem;font-size:.7rem"></span>
</button>
<div class="mobile-summary-sheet" id="mobileSummarySheet">
  <div class="sheet-backdrop" onclick="closeMobileSheet()"></div>
  <div class="sheet-content">
    <div class="sheet-handle"></div>
    <button class="sheet-close" onclick="closeMobileSheet()">&#x2715;</button>
    <div class="sheet-inner" id="sheetInner"></div>
  </div>
</div>
<script>
const ICONS = {
  landingPage: '<svg class="svg-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>',
  portfolio: '<svg class="svg-icon" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>',
  institucional: '<svg class="svg-icon" viewBox="0 0 24 24"><path d="M3 21h18M5 21V7l8-4v18M19 21V11l-6-3M9 9h1M9 13h1M9 17h1M15 13h1M15 17h1"/></svg>',

    { key: 'cadastro', name: 'Cadastro de conteúdo / produtos', desc: 'Gratuito até 20 produtos. Acima disso, R$ 0,80 por item excedente.', isCustomCalc: true },
    { key: 'dominio', name: 'Configuração de domínio (1 ano)', desc: 'Auxílio completo na conexão e registro do seu endereço oficial por 1 ano.', price: PRICES.dominio },
    { key: 'hospedagem', name: 'Configuração de hospedagem', desc: 'Ambiente onde o site ficará publicado de forma rápida e segura.', isFree: true, price: 0 }
  ];
  const cards = extras.map(e => {
    const sel = state.extras.includes(e.key) ? 'selected' : '';
    let priceStr = '';
    if (e.isCustomCalc) {
      const cost = calcCadastro();
      const calcText = state.qtdProdutos <= 20
        ? '<span style="color:var(--success);font-weight:700">Até 20 itens: Gratuito (R$ 0,00)</span>'
        : '<span style="color:var(--primary);font-weight:700">20 grátis + ' + (state.qtdProdutos - 20) + ' adic. (+ R$ ' + fmt(cost) + ')</span>';
      priceStr = '<div style="font-size:0.75rem;margin-top:0.35rem" id="cadastroCalcLabel">' + calcText + '</div>' +
        '<div class="product-counter" onclick="event.stopPropagation()">' +
          '<span style="font-size:0.75rem;font-weight:600;color:var(--muted)">Qtd produtos:</span>' +
          '<button type="button" class="counter-btn" onclick="changeQtdProdutos(-10, event)">-</button>' +
          '<input type="number" id="inputQtdProdutos" class="counter-input" min="1" max="2000" value="' + state.qtdProdutos + '" onchange="setQtdProdutos(this.value, event)" onclick="event.stopPropagation()"/>' +
          '<button type="button" class="counter-btn" onclick="changeQtdProdutos(10, event)">+</button>' +
        '</div>';
    } else if (e.isFree) {
      priceStr = '<span class="feature-price free">✓ Incluso gratuitamente</span>';
    } else {
      priceStr = '<span class="feature-price">+ R$ ' + fmt(e.price) + '</span>';
    }
    return '<div class="feature-card ' + sel + '" onclick="toggleExtra(\'' + e.key + '\')"><div class="feature-checkbox">' + SVG_CHECK + '</div><div class="feature-info"><div class="feature-name">' + ICONS[e.key] + ' <span>' + e.name + '</span></div><div class="feature-desc">' + e.desc + '</div>' + priceStr + '</div></div>';
  }).join('');
  return '<div class="step-panel" id="step-4"><div class="step-header"><div class="step-eyebrow">Etapa 5 de ' + STEPS.length + '</div><h1 class="step-title">Precisa de ajuda com o conteúdo?</h1><p class="step-subtitle">Serviços complementares para deixar seu projeto 100% pronto sem dor de cabeça.</p></div><div class="feature-grid">' + cards + '</div></div>';
}
function renderStep5() {
  return '<div class="step-panel" id="step-5"><div class="final-hero"><span class="final-hero-emoji">🚀</span><h2>Seu projeto está quase pronto!</h2><p>Preencha seus dados para receber o orçamento completo e personalizado.</p></div><div class="step-header"><div class="step-eyebrow">Etapa 6 de ' + STEPS.length + '</div><h1 class="step-title">Sobre você</h1><p class="step-subtitle">Precisamos de algumas informações para formalizar seu orçamento.</p></div><div class="form-row"><div class="form-group"><label class="form-label">Seu nome *</label><input class="form-input" type="text" id="inputNome" placeholder="Como podemos te chamar?" value="' + esc(state.nome) + '" oninput="state.nome=this.value;renderSummary()" /></div><div class="form-group"><label class="form-label">Empresa <span>(opcional)</span></label><input class="form-input" type="text" id="inputEmpresa" placeholder="Nome da sua empresa" value="' + esc(state.empresa) + '" oninput="state.empresa=this.value;renderSummary()" /></div></div><div class="form-row"><div class="form-group"><label class="form-label">WhatsApp *</label><input class="form-input" type="tel" id="inputWA" placeholder="(34) 99999-9999" value="' + esc(state.whatsapp) + '" oninput="state.whatsapp=this.value;renderSummary()" /></div><div class="form-group"><label class="form-label">E-mail <span>(opcional)</span></label><input class="form-input" type="email" id="inputEmail" placeholder="seu@email.com" value="' + esc(state.email) + '" oninput="state.email=this.value;renderSummary()" /></div></div><div class="form-group"><label class="form-label">Conte sobre seu projeto <span>(opcional)</span></label><textarea class="form-input" id="inputDesc" placeholder="Descreva o objetivo do site, público-alvo, detalhes especiais..." oninput="state.descricao=this.value;renderSummary()">' + esc(state.descricao) + '</textarea></div><div class="divider"></div><div class="form-group"><label class="form-label">Você já possui identidade visual / logotipo?</label><div class="radio-group"><div class="radio-opt ' + (state.temLogo === "sim" ? "selected" : "") + '" onclick="selectLogo(\'sim\')">✓ Sim, já tenho</div><div class="radio-opt ' + (state.temLogo === "nao" ? "selected" : "") + '" onclick="selectLogo(\'nao\')">✗ Ainda não</div></div></div><div class="form-group"><label class="form-label">Site de referência <span>(opcional)</span></label><input class="form-input" type="url" id="inputRef" placeholder="https://exemplo.com.br" value="' + esc(state.referencia) + '" oninput="state.referencia=this.value" /></div><div style="margin-top:1.5rem"><button class="btn btn-whatsapp" onclick="sendWhatsApp()"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>Solicitar orçamento pelo WhatsApp</button></div><p style="font-size:.75rem;color:#94A3B8;text-align:center;margin-top:1rem;line-height:1.5">Ao clicar, você será redirecionado para o WhatsApp com a sua configuração completa.<br>O orçamento final será confirmado após análise do projeto.</p></div>';
}
function renderSummaryHTML() {
  const typeName = { landingPage: 'Landing Page', portfolio: 'Portfólio', institucional: 'Site Institucional', cardapio: 'Cardápio Online', catalogo: 'Catálogo Online', personalizado: 'Projeto Personalizado' };
  const sizeName = { sec4: 'Até 4 seções', sec6: 'Até 6 seções', sec8: 'Até 8 seções', sec10: 'Até 10 seções', sec10p: 'Mais de 10 seções' };
  const designName = { designEssencial: 'Essencial', designPersonalizado: 'Personalizado', designPremium: 'Premium' };
  const featureNames = { whatsapp: 'WhatsApp', formulario: 'Formulário', mapa: 'Google Maps', galeria: 'Galeria', depoimentos: 'Depoimentos', faq: 'FAQ', instagram: 'Instagram', analytics: 'Analytics', pixel: 'Meta Pixel', leads: 'Captura de leads', agendamento: 'Agendamento online (Painel Admin)', flowAnalytic: 'Flow Analytic (R$ 25/mês)' };
  const cadCost = calcCadastro();
  const cadDesc = 'Cadastro (' + state.qtdProdutos + ' itens: ' + (cadCost === 0 ? 'Grátis' : '+ R$ ' + fmt(cadCost)) + ')';
  const extraNames = { textos: 'Criação de textos', revisao: 'Revisão de textos', tratamento: 'Tratamento de imagens', pesquisa: 'Pesquisa de imagens', cadastro: cadDesc, dominio: 'Domínio (1 ano)', hospedagem: 'Hospedagem inclusa' };
  const td = totalDisplay();
  let priceHtml = '';
  if (td.custom) {
    priceHtml = '<div class="summary-price-custom">Sob análise' + (td.hasFlow ? ' <span style="font-size:.85rem;color:var(--primary);display:block;margin-top:.25rem">+ R$ 25,00/mês (Flow Analytic)</span>' : '') + '</div>';
  } else {
    priceHtml = '<div class="summary-price"><span class="currency">R$&nbsp;</span>' + td.str + '</div>' +
      (td.hasFlow ? '<div style="font-size:0.85rem;font-weight:700;color:var(--primary);margin-top:0.35rem">+ R$ 25,00/mês (Flow Analytic)</div>' : '');
  }
  const ft = state.features.map(f => '<span class="summary-tag">' + (featureNames[f] || f) + '</span>').join('');
  const et = state.extras.map(e => '<span class="summary-tag" style="background:#F1F5F9;color:var(--muted)">' + (extraNames[e] || e) + '</span>').join('');
  return '<div class="summary-header"><div class="summary-header-icon"><svg width="18" height="18" fill="none" stroke="white" stroke-width="2" viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg></div><div><h3>Seu projeto</h3><p>Estimativa em tempo real</p></div></div><div class="summary-body"><div class="summary-item"><div class="summary-item-label">Tipo de site</div><div class="summary-item-value ' + (state.siteType ? '' : 'empty') + '">' + (state.siteType ? typeName[state.siteType] : 'Não selecionado') + '</div></div><div class="summary-item"><div class="summary-item-label">Tamanho</div><div class="summary-item-value ' + (state.siteSize ? '' : 'empty') + '">' + (state.siteSize ? sizeName[state.siteSize] : 'Não selecionado') + '</div></div><div class="summary-item"><div class="summary-item-label">Funcionalidades</div>' + (ft ? '<div class="summary-tags">' + ft + '</div>' : '<div class="summary-item-value empty">Nenhuma selecionada</div>') + '</div><div class="summary-item"><div class="summary-item-label">Personalização visual</div><div class="summary-item-value ' + (state.design ? '' : 'empty') + '">' + (state.design ? designName[state.design] : 'Não selecionada') + '</div></div><div class="summary-item"><div class="summary-item-label">Serviços adicionais</div>' + (et ? '<div class="summary-tags">' + et + '</div>' : '<div class="summary-item-value empty">Nenhum selecionado</div>') + '</div></div><div class="summary-footer"><div class="summary-price-label">Estimativa atual</div>' + priceHtml + '<p class="summary-disclaimer">Valor estimado com base nas opções selecionadas. O orçamento final será confirmado após análise do projeto.</p></div>';
}
function renderSummary() {
  const card = document.getElementById('summaryCard'), sheet = document.getElementById('sheetInner');
  const html = renderSummaryHTML();
  if (card) card.innerHTML = html;
  if (sheet && document.getElementById('mobileSummarySheet').classList.contains('open')) sheet.innerHTML = html;
  const td = totalDisplay(), badge = document.getElementById('mobileBadgePrice');
  if (badge) badge.textContent = td.custom ? 'Sob análise' : ('R$ ' + td.str + (td.hasFlow ? ' + R$ 25/mês' : ''));
}
function renderAllPanels() {
  document.getElementById('stepsContainer').innerHTML = renderStep0() + renderStep1() + renderStep2() + renderStep3() + renderStep4() + renderStep5();
}
function showCurrentStep() {
  document.querySelectorAll('.step-panel').forEach(el => el.classList.remove('active'));
  const panel = document.getElementById('step-' + state.currentStep);
  if (panel) panel.classList.add('active');
  const pg = document.getElementById('progressWrapper'), nb = document.getElementById('navButtons'), ss = document.getElementById('successScreen'), mb = document.getElementById('mobileSummaryBtn');
  if (state.currentStep === -1) {
    pg.style.display = 'none';
    nb.style.display = 'none';
    if (mb) mb.style.display = 'none';
    ss.classList.add('active');
  } else {
    pg.style.display = '';
    nb.style.display = '';
    if (mb) mb.style.display = '';
    ss.classList.remove('active');
    renderProgress();
    renderSummary();
    renderNavButtons();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}
function renderNavButtons() {
  const nav = document.getElementById('navButtons'), isFirst = state.currentStep === 0, isLast = state.currentStep === STEPS.length - 1;
  let h = '';
  h += isFirst ? '<div></div>' : '<button class="btn btn-secondary" onclick="goBack()">&#8592; Voltar</button>';
  h += isLast ? '<div></div>' : '<button class="btn btn-primary" onclick="goNext()">Próximo &#8594;</button>';
  nav.innerHTML = h;
}
function goNext() {
  if (state.currentStep === 0 && !state.siteType) { showToast('Selecione o tipo de site para continuar.'); return; }
  if (state.currentStep === 1 && !state.siteSize && state.siteType !== 'personalizado') { showToast('Selecione o tamanho do site para continuar.'); return; }
  if (state.currentStep === 3 && !state.design) { showToast('Selecione uma opção de personalização visual.'); return; }
  if (state.currentStep === 0 && state.siteType === 'personalizado') state.currentStep = 2;
  else state.currentStep++;
  showCurrentStep();
}
function goBack() {
  if (state.currentStep === 2 && state.siteType === 'personalizado') state.currentStep = 0;
  else state.currentStep--;
  showCurrentStep();
}
function selectType(key) {
  state.siteType = key;
  document.querySelectorAll('#step-0 .option-card').forEach(el => {
    el.classList.toggle('selected', el.getAttribute('data-type') === key);
  });
  renderSummary();
  setTimeout(() => {
    if (key === 'personalizado') {
      state.siteSize = null;
      state.currentStep = 2;
    } else {
      state.currentStep = 1;
    }
    showCurrentStep();
  }, 160);
}
function selectSize(key) {
  state.siteSize = key;
  document.querySelectorAll('#step-1 .size-option').forEach(el => {
    el.classList.toggle('selected', el.getAttribute('onclick').includes("'" + key + "'"));
  });
  renderSummary();
  setTimeout(() => {
    state.currentStep = 2;
    showCurrentStep();
  }, 160);
}
function toggleFeature(key) {
  if (state.features.includes(key)) state.features = state.features.filter(f => f !== key);
  else state.features.push(key);
  const card = document.querySelector('#step-2 .feature-card[onclick*="\'' + key + '\'"]');
  if (card) card.classList.toggle('selected', state.features.includes(key));
  const ln = document.getElementById('leadsNote');
  if (ln) ln.style.display = state.features.includes('leads') ? 'flex' : 'none';
  renderSummary();
}
function toggleExtra(key) {
  if (state.extras.includes(key)) state.extras = state.extras.filter(e => e !== key);
  else state.extras.push(key);
  const card = document.querySelector('#step-4 .feature-card[onclick*="\'' + key + '\'"]');
  if (card) card.classList.toggle('selected', state.extras.includes(key));
  renderSummary();
}
function selectDesign(key) {
  state.design = key;
  document.querySelectorAll('#step-3 .option-card').forEach(el => {
    const k = el.getAttribute('onclick').match(/'([^']+)'/)?.[1];
    el.classList.toggle('selected', k === key);
  });
  renderSummary();
  setTimeout(() => {
    state.currentStep = 4;
    showCurrentStep();
  }, 160);
}
function selectLogo(val) {
  state.temLogo = val;
  document.querySelectorAll('.radio-opt').forEach(el => {
    el.classList.toggle('selected', el.getAttribute('onclick').includes("'" + val + "'"));
  });
}
function sendWhatsApp() {
  if (!state.nome.trim()) { showToast('Por favor, informe seu nome.'); document.getElementById('inputNome')?.focus(); return; }
  if (!state.whatsapp.trim()) { showToast('Por favor, informe seu WhatsApp.'); document.getElementById('inputWA')?.focus(); return; }
  const typeName = { landingPage: 'Landing Page', portfolio: 'Portfólio', institucional: 'Site Institucional', cardapio: 'Cardápio Online', catalogo: 'Catálogo Online', personalizado: 'Projeto Personalizado' };
  const sizeName = { sec4: 'Até 4 seções', sec6: 'Até 6 seções', sec8: 'Até 8 seções', sec10: 'Até 10 seções', sec10p: 'Mais de 10 seções' };
  const designName = { designEssencial: 'Essencial', designPersonalizado: 'Personalizado', designPremium: 'Premium' };
  const featureNames = { whatsapp: 'Botão de WhatsApp', formulario: 'Formulário de contato', mapa: 'Google Maps', galeria: 'Galeria de fotos', depoimentos: 'Depoimentos', faq: 'FAQ (Perguntas Frequentes)', instagram: 'Integração Instagram', analytics: 'Google Analytics', pixel: 'Meta Pixel', leads: 'Captura de leads', agendamento: 'Agendamento online (Painel Admin)', flowAnalytic: 'Flow Analytic (R$ 25/mês)' };
  const cadCost = calcCadastro();
  const cadDesc = 'Cadastro de conteúdo: ' + state.qtdProdutos + ' produtos (' + (cadCost === 0 ? 'Gratuito até 20 itens' : '+ R$ ' + fmt(cadCost)) + ')';
  const extraNames = { textos: 'Criação dos textos', revisao: 'Revisão dos textos', tratamento: 'Tratamento de imagens', pesquisa: 'Pesquisa de imagens', cadastro: cadDesc, dominio: 'Configuração de domínio (1 ano)', hospedagem: 'Hospedagem inclusa' };
  const td = totalDisplay();
  let priceStr = td.custom ? 'Sob análise' : 'R$ ' + td.str;
  if (td.hasFlow) {
    priceStr += ' (+ R$ 25,00/mês Flow Analytic)';
  }
  const fl = state.features.length ? state.features.map(f => '• ' + (featureNames[f] || f)).join('\n') : '• Nenhuma';
  const el = state.extras.length ? state.extras.map(e => '• ' + (extraNames[e] || e)).join('\n') : '• Nenhum';
  let msg = 'Olá! Montei uma estimativa para meu site através da plataforma *Monte seu Site* da PageMaster.\n\n';
  msg += '*Tipo de projeto:*\n' + (typeName[state.siteType] || 'Não informado') + '\n\n';
  if (state.siteType !== 'personalizado') {
    msg += '*Quantidade de seções:*\n' + (sizeName[state.siteSize] || 'Não informado') + '\n\n';
  }
  msg += '*Funcionalidades:*\n' + fl + '\n\n';
  msg += '*Personalização visual:*\n' + (designName[state.design] || 'Não informado') + '\n\n';
  msg += '*Serviços adicionais:*\n' + el + '\n\n';
  msg += '*Estimativa apresentada:*\n' + priceStr + '\n\n';
  msg += '*Nome:*\n' + state.nome + '\n\n';
  if (state.empresa) msg += '*Empresa:*\n' + state.empresa + '\n\n';
  msg += '*WhatsApp:*\n' + state.whatsapp + '\n\n';
  if (state.email) msg += '*E-mail:*\n' + state.email + '\n\n';
  if (state.descricao) msg += '*Sobre o projeto:*\n' + state.descricao + '\n\n';
  if (state.temLogo) msg += '*Possui identidade visual / logo:*\n' + (state.temLogo === 'sim' ? 'Sim' : 'Não') + '\n\n';
  if (state.referencia) msg += '*Site de referência:*\n' + state.referencia + '\n\n';
  msg += 'Gostaria de receber mais informações para dar continuidade ao projeto.';
  window.open('https://wa.me/' + WHATSAPP_NUMBER + '?text=' + encodeURIComponent(msg), '_blank');
  state.currentStep = -1;
  showCurrentStep();
}
function confirmReset() {
  if (confirm('Tem certeza que deseja recomeçar? Todas as escolhas serão reiniciadas.')) fullReset();
}
function fullReset() {
  state = { currentStep: 0, siteType: null, siteSize: null, features: [], design: null, extras: [], qtdProdutos: 20, nome: '', empresa: '', whatsapp: '', email: '', descricao: '', temLogo: null, referencia: '' };
  renderAllPanels();
  showCurrentStep();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function openMobileSheet() {
  const sh = document.getElementById('sheetInner');
  if (sh) sh.innerHTML = renderSummaryHTML();
  document.getElementById('mobileSummarySheet').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeMobileSheet() {
  document.getElementById('mobileSummarySheet').classList.remove('open');
  document.body.style.overflow = '';
}
function showToast(msg) {
  const ex = document.querySelector('.toast-msg');
  if (ex) ex.remove();
  const t = document.createElement('div');
  t.className = 'toast-msg';
  t.textContent = msg;
  Object.assign(t.style, { position: 'fixed', bottom: '5rem', left: '50%', transform: 'translateX(-50%)', background: '#0F172A', color: '#fff', padding: '0.875rem 1.5rem', borderRadius: '9999px', fontSize: '0.875rem', fontWeight: '600', zIndex: '999', whiteSpace: 'nowrap', boxShadow: '0 8px 32px rgba(0,0,0,0.25)', animation: 'fadeIn 0.3s ease' });
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}
document.addEventListener('DOMContentLoaded', () => {
  renderAllPanels();
  showCurrentStep();
});
</script>
</body>
</html>
